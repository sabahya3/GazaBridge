# cargo-deny configuration: advisories, licenses, banned crates, sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, but no known vulnerability, and no maintained replacement upstream yet.
  { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar: only used by testcontainers in tests, never shipped" },
  { id = "RUSTSEC-2024-0436", reason = "paste: build-time macro pulled in by Leptos" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro pulled in by GTK (Tauri on Linux)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path; they are never published.
allow-wildcard-paths = true
# OpenSSL is avoided in favour of rustls/native platform TLS.
deny = [
  { name = "openssl-sys", reason = "use rustls or the platform TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
