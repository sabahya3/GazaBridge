# cargo-deny configuration: advisories, licenses, banned crates, sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa is only a lockfile entry of sqlx-mysql via sqlx-macros and is not compiled; see .cargo/audit.toml" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# OpenSSL is avoided in favour of rustls/native platform TLS.
deny = [
  { name = "openssl-sys", reason = "use rustls or the platform TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
