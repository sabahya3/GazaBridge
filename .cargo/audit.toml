# cargo-audit configuration. Every ignore needs a justification and a review date.
[advisories]
ignore = [
  # RUSTSEC-2023-0071 (rsa, Marvin timing side channel on RSA *decryption*).
  # `rsa` appears in Cargo.lock only as an optional dependency of sqlx-mysql
  # via sqlx-macros; it is not compiled into any GazaBridge binary
  # (`cargo tree -i rsa --target all` is empty). Re-evaluate when a MySQL
  # driver is added (Milestone 2). Review by 2027-01-31.
  "RUSTSEC-2023-0071",
]
informational_warnings = ["unmaintained", "unsound"]
