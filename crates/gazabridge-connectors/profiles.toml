  "Pooled (-pooler) endpoints run PgBouncer in transaction mode; use the direct endpoint for transactions spanning statements and for CDC.",
  "Logical replication must be enabled in the Neon project settings before CDC.",
  "Computes may auto-suspend; the first connection after suspension can take several seconds.",
]
unsupported_operations = ["Superuser-only operations"]
[profile.defaults]
port = 5432
database = "neondb"
tls = "verify-full"
[profile.supported_versions]
min = "14"
[profile.detection]
version_string_contains = ["postgresql"]
host_suffixes = [".neon.tech"]

