# -------------------------------------------------------------------- SQLite

[[profile]]
id = "sqlite.sqlite"
family = "sqlite"
display_name = "SQLite"
vendor_icon = "sqlite"
status = "beta"
auth_methods = ["none"]
tested_versions = ["3.46"]
documentation_url = "https://www.sqlite.org/docs.html"
known_limitations = [
  "SQLite has no native change data capture; synchronization uses polling (timestamp, increasing key or an application-managed change log).",
  "Column types are affinities; values of other types may be stored in any column unless the table is STRICT.",
  "Only one writer at a time; concurrent writes wait up to the busy timeout.",
  "GazaBridge uses its bundled SQLite 3.46 library regardless of the system SQLite version.",
  "Range filters on columns that store numbers as text (big integers, unsigned 64-bit, decimals) are rejected rather than compared lexically.",
  "Columns declared NUMERIC or DECIMAL by other tools keep only about 15 significant digits; SQLite may have rounded such values before GazaBridge reads them.",
]
[profile.contract_evidence]
suite_version = "1.0"
versions = ["3.46"]
recorded_at = "2026-10-24"
[profile.supported_versions]
min = "3.35"
[profile.detection]
version_string_contains = ["sqlite"]
