known_limitations = [
  "No PostgreSQL logical replication; CDC is limited to polling-based methods.",
  "Transactions are SERIALIZABLE by default and may need client-side retries.",
  "Catalog differences: some pg_catalog views are incomplete, so inspection is best-effort.",
