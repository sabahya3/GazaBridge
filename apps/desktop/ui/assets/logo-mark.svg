<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">GazaBridge</title>
  <!-- App icon: abstract bridge on a dark-green tile. -->
  <rect width="512" height="512" rx="112" fill="#14532D"/>
  <g fill="none" stroke="#F4F7F5" stroke-linecap="round" stroke-linejoin="round">
    <!-- arch -->
    <path d="M96 300 C 170 150, 342 150, 416 300" stroke-width="30"/>
    <!-- deck -->
    <path d="M72 300 H 440" stroke-width="30"/>
    <!-- pillars -->
    <path d="M150 300 V 392" stroke-width="30"/>
    <path d="M362 300 V 392" stroke-width="30"/>
    <!-- hangers -->
    <path d="M208 222 V 300 M256 206 V 300 M304 222 V 300" stroke-width="16" opacity="0.85"/>
  </g>
  <!-- water line accent -->
  <path d="M112 420 H 400" stroke="#4ADE80" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
</svg>
