[package]
name = "gazabridge-ui"
description = "GazaBridge desktop user interface (Leptos, compiled to WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
gazabridge-ipc.workspace = true
leptos = { version = "0.8.12", features = ["csr"] }
serde.workspace = true
serde-wasm-bindgen = "0.6.5"
serde_json.workspace = true
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.82", features = ["Document", "Element", "HtmlElement", "KeyboardEvent", "Window"] }

[lints]
workspace = true
