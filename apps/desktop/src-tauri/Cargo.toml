[package]
name = "gazabridge-desktop"
description = "GazaBridge desktop application (Tauri backend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gazabridge-desktop"

[lib]
name = "gazabridge_desktop"
crate-type = ["rlib"]

[features]
# Serves the bundled UI instead of the dev server; `cargo tauri build` enables it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
gazabridge-application.workspace = true
gazabridge-connector-mongodb.workspace = true
gazabridge-connector-postgres.workspace = true
gazabridge-connector-sqlite.workspace = true
gazabridge-connectors.workspace = true
gazabridge-domain.workspace = true
gazabridge-mapping.workspace = true
gazabridge-migration.workspace = true
gazabridge-files.workspace = true
gazabridge-ipc.workspace = true
gazabridge-query.workspace = true
gazabridge-observability.workspace = true
gazabridge-plugin-sdk.workspace = true
gazabridge-secrets.workspace = true
gazabridge-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.9", features = [] }
tauri-plugin-dialog = "2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
futures.workspace = true
tokio-util.workspace = true
mongodb = "3.9"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
gazabridge-plugin-sdk.workspace = true

[lints]
workspace = true
