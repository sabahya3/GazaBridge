<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>GazaBridge</title>
  <!-- Palestinian flag; a bridge whose central pier is a database. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="171" fill="#101010"/>
    <rect y="171" width="512" height="170" fill="#FFFFFF"/>
    <rect y="341" width="512" height="171" fill="#149954"/>
    <path d="M0 0 L236 256 L0 512 Z" fill="#E4312B"/>
    <g filter="url(#lift)" stroke-linecap="round" stroke-linejoin="round">
      <!-- arch: dark casing, white core -->
      <path d="M140 330 Q300 40 460 330" fill="none" stroke="#101010" stroke-width="50"/>
      <g stroke="#101010" stroke-width="26">
        <line x1="220" y1="221" x2="220" y2="330"/>
        <line x1="300" y1="185" x2="300" y2="330"/>
        <line x1="380" y1="221" x2="380" y2="330"/>
      </g>
      <path d="M140 330 Q300 40 460 330" fill="none" stroke="#FFFFFF" stroke-width="28"/>
      <g stroke="#FFFFFF" stroke-width="10">
        <line x1="220" y1="221" x2="220" y2="330"/>
        <line x1="300" y1="185" x2="300" y2="330"/>
        <line x1="380" y1="221" x2="380" y2="330"/>
      </g>
      <!-- deck -->
      <rect x="100" y="316" width="400" height="34" rx="17" fill="#FFFFFF" stroke="#101010" stroke-width="10"/>
      <!-- database pier, hanging from the deck -->
      <g fill="#FFFFFF" stroke="#101010" stroke-width="10">
        <path d="M238 372 v84 a62 20 0 0 0 124 0 v-84"/>
        <ellipse cx="300" cy="372" rx="62" ry="20"/>
        <path d="M238 414 a62 20 0 0 0 124 0" fill="none"/>
      </g>
    </g>
  </g>
</svg>
